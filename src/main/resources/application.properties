spring.application.name=medi-track
spring.config.import=optional:file:.env[.properties]

telegram.bot.username=@medi_track_bot

spring.datasource.url=jdbc:postgresql://localhost:5438/medication
spring.datasource.username=medi_user
spring.datasource.password=medi_pwd

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true
spring.jpa.generate-ddl=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

telegram.bot.token=${TELEGRAM_BOT_TOKEN}

spring.data.mongodb.uri=mongodb://localhost:27017/medication
