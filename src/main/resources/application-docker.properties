# Activate with SPRING_PROFILES_ACTIVE=docker when the app runs in Docker Compose.
spring.datasource.url=jdbc:postgresql://${DB_HOST:postgres_db}:${DB_PORT:5432}/${DB_NAME:medication}
spring.datasource.username=${DB_USER:medi_user}
spring.datasource.password=${DB_PASSWORD:medi_pwd}
spring.mongodb.uri=mongodb://${DB_USER:medi_user}:${DB_PASSWORD:medi_pwd}@mongodb:27017/${DB_NAME:medication}?authSource=admin

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:kafka:29092}

# Producer defaults
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all

# Consumer defaults
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP_ID:medi-track}
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties[spring.json.trusted.packages]=com.schorsche94.medi_track.domain.model
spring.kafka.consumer.auto-offset-reset=earliest

# Spring Kafka listener defaults
spring.kafka.listener.ack-mode=record
